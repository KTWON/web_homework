<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數據檢驗工具箱</title>
<meta name="description" content="以統計方法檢驗資料特性的線上工具集，目前提供班佛定律（Benford's Law）第一、第二定律檢驗器。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef0f7; --surface:#ffffff; --ink:#1c2141; --muted:#5d6285; --rule:#d7daea; --rule-strong:#b8bcd6;
  --accent:#4b55c9; --accent2:#d2527c;
  --dot:rgba(28,33,65,.10); --glow:rgba(75,85,201,.18); --glow2:rgba(210,82,124,.14);
  --display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12152a; --surface:#1b1f3a; --ink:#e6e8f5; --muted:#a2a7c7; --rule:#2c3154; --rule-strong:#3e4470;
    --accent:#8f9bff; --accent2:#f08aab;
    --dot:rgba(230,232,245,.08); --glow:rgba(143,155,255,.16); --glow2:rgba(240,138,171,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#12152a; --surface:#1b1f3a; --ink:#e6e8f5; --muted:#a2a7c7; --rule:#2c3154; --rule-strong:#3e4470;
  --accent:#8f9bff; --accent2:#f08aab;
  --dot:rgba(230,232,245,.08); --glow:rgba(143,155,255,.16); --glow2:rgba(240,138,171,.10);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  /* 背景：兩團柔和光暈 + 細點網格 */
  background-image:
    radial-gradient(56rem 38rem at 100% -8%, var(--glow), transparent 62%),
    radial-gradient(46rem 34rem at -8% 108%, var(--glow2), transparent 62%),
    radial-gradient(var(--dot) 1px, transparent 1.4px);
  background-size:auto,auto,22px 22px;
  background-attachment:fixed;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
header.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:.06em}
.brand span{color:var(--accent)}
header.top nav a{font-size:.9rem;color:var(--muted);text-decoration:none;margin-left:20px}
header.top nav a:hover{color:var(--ink)}

.hero{padding:72px 0 56px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,6.5vw,4.4rem);line-height:1.2;margin:0;letter-spacing:.04em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:34em;color:var(--muted);font-size:1.08rem;margin:20px 0 0}

h2{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0 0 18px;display:flex;align-items:baseline;gap:12px}
h2 small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:400}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:72px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px 22px 20px;text-decoration:none;min-height:250px;
  box-shadow:0 1px 2px rgba(28,33,65,.06),0 8px 24px -12px rgba(28,33,65,.18);transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--accent);transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){a.card:hover{transform:none}}
.card .tag{align-self:flex-start;font-size:.75rem;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:0 12px;line-height:1.9}
.card h3{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:14px 0 6px;line-height:1.35}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.card .go{margin-top:auto;padding-top:16px;font-weight:600;color:var(--accent)}
.mini{display:flex;height:30px;gap:3px;margin-top:16px}
.mini i{display:block;border-radius:6px;font-style:normal;font-weight:700;font-size:.75rem;padding:4px 0 0 6px;line-height:1.2;color:#fff;min-width:0;overflow:hidden}
.card.soon{min-height:160px;background:transparent;box-shadow:none;border:1.5px dashed var(--rule-strong);align-items:flex-start;justify-content:center;color:var(--muted)}
.card.soon h3{color:var(--muted);font-size:1.2rem}
.card.soon .plus{font-size:2rem;line-height:1;color:var(--rule-strong)}

footer{border-top:1px solid var(--rule);padding:22px 0 36px;font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">數據檢驗<span>工具箱</span></span>
    <nav><a href="#tools">工具</a><a href="#about">關於</a></nav>
  </header>

  <section class="hero">
    <h1>讓數字自己<br><em>說出它的來歷</em></h1>
    <p>一組以統計方法檢驗資料特性的線上工具。所有計算都在你的瀏覽器中完成，上傳的檔案不會離開你的電腦。</p>
  </section>

  <section id="tools">
    <h2>工具 <small id="toolCount"></small></h2>
    <div class="tools" id="toolGrid"></div>
  </section>

  <footer id="about">
    <span>數據檢驗工具箱，以 GitHub Pages 架設。</span>
    <span id="year"></span>
  </footer>
</div>

<script>
/* =====================================================================
   工具清單：新增工具時，只要在這個陣列加一筆即可。
   - href：工具頁面的相對路徑（建議每個工具放在自己的資料夾，例如 newtool/index.html → "newtool/"）
   - visual："benford" 會顯示首位數比例圖示；不填則不顯示圖示
   預留位置（虛線卡片）會自動補上，數量由 PLACEHOLDERS 控制（設為 0 即不顯示）。
   ===================================================================== */
const TOOLS = [
  {
    title: '班佛定律檢驗器',
    tag: '統計檢定',
    desc: '上傳 CSV 或 Excel，檢驗數據的第一位數與第二位數是否符合班佛定律，並產出適用性檢查、異常位數與分析報告。',
    href: 'benford/',
    visual: 'benford'
  }
  // ,{ title:'新工具名稱', tag:'分類', desc:'一句話說明', href:'newtool/' }
];
const PLACEHOLDERS = 2;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function benfordMini(){
  return '<div class="mini" aria-hidden="true">' + [1,2,3,4,5,6,7,8,9].map(d => {
    const p = Math.log10(1 + 1/d);
    return `<i style="width:${p*100}%;background:color-mix(in srgb,var(--accent) ${100-(d-1)*9}%,var(--accent2))">${d<=4?d:''}</i>`;
  }).join('') + '</div>';
}
document.getElementById('toolGrid').innerHTML =
  TOOLS.map(t => `
    <a class="card" href="${esc(t.href)}">
      <span class="tag">${esc(t.tag)}</span>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.desc)}</p>
      ${t.visual === 'benford' ? benfordMini() : ''}
      <span class="go">開啟工具 →</span>
    </a>`).join('') +
  Array.from({length: PLACEHOLDERS}, () => `
    <div class="card soon" aria-label="預留位置">
      <span class="plus">＋</span>
      <h3>新工具即將推出</h3>
      <p>更多資料檢驗工具陸續開發中。</p>
    </div>`).join('');
document.getElementById('toolCount').textContent = `共 ${TOOLS.length} 項`;
document.getElementById('year').textContent = '© ' + new Date().getFullYear();
</script>
</body>
</html>
