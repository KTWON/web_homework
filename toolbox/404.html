<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>找不到頁面</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f2;color:#18202e;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;text-align:center}
@media (prefers-color-scheme:dark){body{background:#11151c;color:#e7eaef}}
h1{font-size:3rem;margin:0}a{color:#2c6b58}
</style></head>
<body><div><h1>404</h1><p>找不到這個頁面。</p><p><a href="/">回到首頁</a></p></div>
<script>
/* GitHub 專案頁面的網址會多一層儲存庫名稱，例如 /repo-name/，這裡自動導回該層首頁 */
const seg=location.pathname.split('/').filter(Boolean);
if(location.hostname.endsWith('github.io')&&seg.length){document.querySelector('a').href='/'+seg[0]+'/';}
</script></body></html>
